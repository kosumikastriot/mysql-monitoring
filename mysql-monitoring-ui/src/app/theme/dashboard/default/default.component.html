<ngx-spinner
  bdColor="rgba(64, 153, 255,0.9)"
  size="medium"
  color="#fff"
  loadingText="Loading..."
  type="ball-clip-rotate-multiple">
</ngx-spinner>
<div class="page-body">
  <div class="row">

      <div class="col-md-6 col-xl-3">
        <div class="card bg-c-green order-card">
          <div class="card-block">
            <h6 class="m-b-20">Server status</h6>
            <h2 class="text-right"><i class="ti-control-play f-left"></i><span>Running</span></h2>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-xl-3">
        <div class="card bg-c-blue order-card">
          <div class="card-block">
            <h6 class="m-b-20">Threads Connected</h6>
            <h2 class="text-right"><i class="ti-bar-chart f-left"></i><span>{{ threadsConnected }}</span></h2>
          </div>
        </div>
      </div>
    <div class="col-md-6 col-xl-3">
      <div class="card bg-c-yellow order-card">
        <div class="card-block">
          <h6 class="m-b-20">Threads Running</h6>
          <h2 class="text-right"><i class="ti-bar-chart f-left"></i><span>{{ threadsRunning }}</span></h2>
        </div>
      </div>
    </div>
    <div class="col-md-6 col-xl-3">
      <div class="card bg-c-green order-card">
        <div class="card-block">
          <h6 class="m-b-20">Server uptime</h6>
          <h2 class="text-right"><i class="ti-control-play f-left"></i><span>{{ serverUptime }}</span></h2>
        </div>
      </div>
    </div>

  </div>

  <div class="row">
    <div class="col-lg-4">
      <app-card [title]="'CPU'">
        <div id="chart-cpu"></div>
      </app-card>
    </div>

    <div class="col-lg-4">
      <app-card [title]="'RAM'">
        <div id="chart-ram"></div>
      </app-card>
    </div>

    <div class="col-lg-4">
      <app-card [title]="'DISK'">
        <div id="chart-disk"></div>
      </app-card>
    </div>

  </div>

  <div class="row">
    <div class="col-lg-12">
      <app-card [title]="'The number of mega-bytes received and sent from all clients'">
        <div id="chart-traffic"></div>
      </app-card>
    </div>
  </div>





</div>
