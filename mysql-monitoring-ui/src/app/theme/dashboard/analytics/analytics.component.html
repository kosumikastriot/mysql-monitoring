<div class="page-body">

  <div class="row">
    <div class="col-lg-6">
      <app-card [title]="'DISK SPACE USAGE'" [headerContent]="'Total disk space usage grouped by the database name'">
        <div class="table-responsive">
          <table class="table" >

            <tr>
              <th>Schema Name</th>
              <th>Space usage</th>
            </tr>

            <tr *ngFor="let theRow of schemaDiskSpaceData">
              <td>{{ theRow[0] }}</td>
              <td>{{ theRow[1]}} MB</td>
            </tr>

          </table>
        </div>
      </app-card>
    </div>
  </div>

  <div class="row">

    <div class="col-md-6 col-xl-3">
      <div class="card ">
        <div class="card-block">
          <h6 class="m-b-20">Total Queries</h6>
          <h2 class="text-right"><i class="ti-pie-chart f-left"></i><span>254</span></h2>
          <p class="m-b-0">Total queries in the log file</p>
        </div>
      </div>
    </div>

    <div class="col-md-6 col-xl-3">
      <div class="card ">
        <div class="card-block">
          <h6 class="m-b-20">Slow Queries</h6>
          <h2 class="text-right"><i class="ti-reload f-left"></i><span>5</span></h2>
          <p class="m-b-0">Queries with avg. duration >= 1s</p>
        </div>
      </div>
    </div>

    <div class="col-md-6 col-xl-3">
      <div class="card ">
        <div class="card-block">
          <h6 class="m-b-20">Avg. Duration</h6>
          <h2 class="text-right"><i class="ti-timer f-left"></i><span>0.002s</span></h2>
          <p class="m-b-0">How slow were your queries?</p>
        </div>
      </div>
    </div>

  </div>

  <div class="row">
    <div class="col-lg-12">
      <app-card [title]="'Queries Container'" [headerContent]="'Total disk space usage grouped by the database name'">
        <div class="table-responsive">
          <table class="table">

            <tr>
              <th>Schema Name</th>
              <th>Space usage</th>
            </tr>

            <tr>
              <td>Smarthome</td>
              <td>11 MB</td>
            </tr>

            <tr>
              <td>wp_aleschra</td>
              <td>24 MB</td>
            </tr>

          </table>
        </div>
      </app-card>
    </div>
  </div>

</div>
